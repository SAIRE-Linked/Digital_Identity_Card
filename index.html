<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SAIRE-Linked Card</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-image:
        linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.35)),
        url("SAIRE - Redesign - Latest - Wallpaper - Design.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* background-blend-mode: multiply; */
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
      background-color: #05070d;
    }

    .glow {
      box-shadow: 0 0 25px rgba(0,255,150,0.4),
                  0 0 50px rgba(0,150,255,0.3);
    }

    .card {
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .gradient-text {
      background: linear-gradient(90deg, #00ff99, #00aaff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-6">

  <div class="card glow rounded-3xl p-8 w-full max-w-sm text-center">

    <!-- LOGO -->
    <img src="SAIRE - Redesign - Latest - PCB.png" class="w-24 mx-auto mb-4 animate-pulse"/>

    <!-- NAME -->
    <h1 class="text-2xl font-bold gradient-text">
      SAIRE-Linked
    </h1>

    <p class="text-gray-400 text-sm mt-1">
      AI-Powered Digital Solutions
    </p>

    <!-- DIVIDER -->
    <div class="my-6 h-px bg-gradient-to-r from-transparent via-green-400 to-transparent"></div>

    <!-- CONTACT -->
    <div class="space-y-3 text-sm">

      <a href="tel:+27694531396" class="block p-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
        📞 Call
      </a>

      <a href="mailto:info@saire-linked.com" class="block p-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
        📧 Email
      </a>

      <a href="https://wa.me/27694531396" class="block p-3 rounded-xl bg-white/5 hover:bg-white/10 transition">
        💬 WhatsApp
      </a>

      <a href="https://yourwebsite.com" class="block p-3 rounded-xl bg-gradient-to-r from-green-400 to-blue-500 text-black font-semibold">
        🌐 Visit Website
      </a>

    </div>

    <!-- CTA -->
    <div class="mt-6">
      <button class="px-6 py-3 rounded-xl bg-gradient-to-r from-green-400 to-blue-500 text-black font-semibold glow">
        <a href="/contact.vcf" download>
  Save Contact
        </a>
      </button>
    </div>

  </div>

</body>
</html>
